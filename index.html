<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Site</title>
    <meta name="description" content="Coming soon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .wrap {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(1200px 600px at 10% 10%, rgba(0,0,0,0.04), transparent),
                    radial-gradient(1200px 600px at 90% 90%, rgba(0,0,0,0.04), transparent);
      }
      .card {
        padding: 28px 32px;
        border-radius: 20px;
        border: 1px solid rgba(0,0,0,.08);
        box-shadow: 0 10px 30px rgba(0,0,0,.06);
        backdrop-filter: blur(6px);
        background: rgba(255,255,255,.65);
      }
      h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 8px; }
      p { margin: 0; opacity: .8; font-size: clamp(14px, 2vw, 18px); }
      .hint { margin-top: 16px; font-size: 12px; opacity: .6; }
      @media (prefers-color-scheme: dark) {
        .card { background: rgba(22,22,24,.6); border-color: rgba(255,255,255,.08); }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>It works 🎉</h1>
        <p>Deployed via GitHub → Vercel. Edit <code>index.html</code> and push — redeploy happens automatically.</p>
        <div class="hint">Tip: change the title/text here to test auto‑deploy.</div>
      </section>
    </main>
  </body>
</html>
